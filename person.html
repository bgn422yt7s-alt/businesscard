<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="ContactFinder – Kontaktprofil"
    >
    <meta
        name="theme-color"
        content="#090909"
    >
    <title>Kontakt | ContactFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app profile-page">
        <!-- =================================================
             HEADER
             ================================================= -->
        <header class="header">
            <a
                href="index.html"
                class="brand"
                aria-label="Zurück zu ContactFinder"
            >
                <div
                    class="brand-mark"
                    aria-hidden="true"
                >
                    CF
                </div>
                <div class="brand-text">
                    <span class="brand-name">
                        ContactFinder
                    </span>
                    <span class="brand-subtitle">
                        CONTACT INTELLIGENCE
                    </span>
                </div>
            </a>
            <div class="header-status">
                <span
                    class="status-dot"
                    aria-hidden="true"
                ></span>
                <span>
                    SECURE PROFILE
                </span>
            </div>
        </header>
        <!-- =================================================
             BACK
             ================================================= -->
        <div class="profile-navigation">
            <a
                href="index.html"
                class="back-link"
            >
                <span
                    aria-hidden="true"
                >
                    ←
                </span>
                Zurück zur Suche
            </a>
        </div>
        <!-- =================================================
             PROFILE
             ================================================= -->
        <section
            id="profile"
            class="profile"
            aria-label="Kontaktprofil"
        >
            <!--
                person.js fügt hier automatisch
                das entsprechende Profil ein.
            -->
        </section>
        <!-- =================================================
             FOOTER
             ================================================= -->
        <footer class="footer">
            <div>
                CONTACTFINDER
            </div>
            <div>
                <span>
                    SECURE
                </span>
                <span
                    class="footer-separator"
                    aria-hidden="true"
                >
                    •
                </span>
                <span>
                    PRIVATE
                </span>
                <span
                    class="footer-separator"
                    aria-hidden="true"
                >
                    •
                </span>
                <span>
                    PRECISE
                </span>
            </div>
        </footer>
    </main>
    <!-- =====================================================
         JAVASCRIPT
         contacts.js stellt die Kontaktdaten bereit.
         person.js verarbeitet die URL-ID und erstellt
         anschließend das Profil.
         REIHENFOLGE IST WICHTIG.
         ===================================================== -->
    <script src="contacts.js"></script>
    <script src="person.js"></script>
</body>
</html>
