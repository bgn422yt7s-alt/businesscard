<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Kontaktprofil | ContactFinder"
    >
    <meta
        name="theme-color"
        content="#090909"
    >
    <title>Kontakt | ContactFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app profile-page">
        <!-- =================================================
             HEADER
             ================================================= -->
        <header class="header">
            <div class="brand">
                <div
                    class="brand-mark"
                    aria-hidden="true"
                >
                    CF
                </div>
                <div class="brand-text">
                    <span class="brand-name">
                        ContactFinder
                    </span>
                    <span class="brand-subtitle">
                        CONTACT INTELLIGENCE
                    </span>
                </div>
            </div>
        </header>
        <!-- =================================================
             PROFILE
             ================================================= -->
        <section
            id="profile"
            class="profile"
            aria-label="Kontaktprofil"
        >
            <!--
                person.js fügt hier automatisch
                das ausgewählte Kontaktprofil ein.
            -->
        </section>
    </main>
    <!-- =====================================================
         JAVASCRIPT
         contacts.js = zentrale Kontaktdaten
         person.js   = Profil + Kontakt speichern
         ===================================================== -->
    <script src="contacts.js"></script>
    <script src="person.js"></script>
</body>
</html>
