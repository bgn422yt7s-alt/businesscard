<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Kontaktprofil | ContactFinder"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <title>
        Kontakt | ContactFinder
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app profile-page">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="header">

            <div class="brand">

                <div
                    class="brand-mark"
                    aria-hidden="true"
                >
                    CF
                </div>

                <div class="brand-text">

                    <span class="brand-name">
                        ContactFinder
                    </span>

                    <span class="brand-subtitle">
                        CONTACT INTELLIGENCE
                    </span>

                </div>

            </div>

        </header>


        <!-- =================================================
             PROFIL
             ================================================= -->

        <section
            id="profile"
            class="profile"
            aria-label="Kontaktprofil"
        >

            <!-- app.js lädt hier das Profil -->

        </section>


    </main>


    <!-- AUCH HIER NUR DIE EINE DATEI -->

    <script src="app.js"></script>

</body>

</html>
