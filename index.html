<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ContactFinder – Kontakte präzise und elegant finden."
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <title>ContactFinder</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="header">

            <div class="brand">

                <div
                    class="brand-mark"
                    aria-hidden="true"
                >
                    CF
                </div>

                <div class="brand-text">

                    <span class="brand-name">
                        ContactFinder
                    </span>

                    <span class="brand-subtitle">
                        CONTACT INTELLIGENCE
                    </span>

                </div>

            </div>

        </header>


        <!-- =================================================
             HERO
             ================================================= -->

        <section class="hero">

            <div class="hero-label">

                <span aria-hidden="true"></span>

                SMART CONTACT SEARCH

            </div>

            <h1>
                Finden Sie den<br>
                <strong>richtigen Kontakt.</strong>
            </h1>

            <p>
                Präzise. Schnell. Diskret.
            </p>

        </section>


        <!-- =================================================
             SUCHE
             ================================================= -->

        <section
            class="search-section"
            aria-label="Kontaktsuche"
        >

            <div class="search-container">

                <div
                    class="search-icon"
                    aria-hidden="true"
                >

                    <svg
                        viewBox="0 0 24 24"
                    >

                        <circle
                            cx="11"
                            cy="11"
                            r="6.5"
                        ></circle>

                        <line
                            x1="16"
                            y1="16"
                            x2="21"
                            y2="21"
                        ></line>

                    </svg>

                </div>


                <input
                    id="search"
                    type="search"
                    placeholder="Person suchen..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    aria-label="Person suchen"
                >


                <div
                    class="search-command"
                    aria-hidden="true"
                >
                    ⌘ K
                </div>

            </div>


            <div class="search-hint">

                Namen, Unternehmen oder andere Informationen eingeben

            </div>

        </section>


        <!-- =================================================
             ERGEBNISSE
             ================================================= -->

        <section
            class="results-section"
            aria-label="Suchergebnisse"
        >

            <div class="section-header">

                <div>

                    <span class="section-label">
                        RESULTS
                    </span>

                    <h2>
                        Suchergebnisse
                    </h2>

                </div>


                <div
                    id="resultCount"
                    class="result-count"
                    aria-live="polite"
                >
                    0 Kontakte
                </div>

            </div>


            <div
                id="results"
                class="results"
                aria-live="polite"
            ></div>

        </section>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer class="footer">

            <span>
                CONTACTFINDER
            </span>

            <span>
                CONTACT INTELLIGENCE
            </span>

        </footer>

    </main>


    <!-- NUR DIESE EINE JAVASCRIPT-DATEI -->

    <script src="app.js"></script>

</body>

</html>
